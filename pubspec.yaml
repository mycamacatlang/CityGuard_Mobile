name: towncare
description: Flutter application for TownCare services.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  font_awesome_flutter: ^10.7.0
  path_provider: ^2.1.2
  http: ^1.2.0
  image_picker: ^1.0.7
  connectivity_plus: ^6.0.3

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  tflite_flutter: ^0.12.1
  image: ^4.2.0

  geolocator: ^13.0.0

  flutter_dotenv: ^5.1.0

  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/emergency_model.tflite
    - assets/models/labels.txt
